plugins {
    id 'com.android.application'
}

// Chave fixa de assinatura: lida do keystore.properties (fora do git, criado pelo criar-chave.bat).
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.myfriend'

    signingConfigs {
        if (keystoreFile.exists()) {
            upload {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    compileSdk 34

    defaultConfig {
        applicationId 'com.myfriend'
        minSdk 30
        targetSdk 34
        versionCode 15
        versionName '1.15.0'
    }

    buildTypes {
        release {
            // R8: remove código não usado, otimiza e encurta nomes.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Usa a chave fixa se existir; sem ela cai na de debug (que muda de PC para PC).
            signingConfig keystoreFile.exists() ? signingConfigs.upload : signingConfigs.debug
            vcsInfo.include false
        }
    }

    packaging {
        // Comprime o classes.dex dentro do APK (o padrão do AGP é guardar sem compressão).
        dex {
            useLegacyPackaging true
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
